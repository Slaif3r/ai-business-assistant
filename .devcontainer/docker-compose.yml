version: "3.8"

services:
  ai-business-assistant:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev

    container_name: ai-business-assistant-dev
    hostname: ai-business-assistant

    command: sleep infinity

    volumes:
      - .:/workspaces/ai-business-assistant:cached

    ports:
      - "8501:8501"
      - "8888:8888"

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
