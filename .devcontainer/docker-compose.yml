version: "3.8"

services:
  ai-business-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev

    container_name: ${CONTAINER_NAME:-ai-business-assistant-dev}
    hostname: ${HOSTNAME:-ai-business-assistant}

    command: sleep infinity

    volumes:
      - ..:/workspaces/AI-buss-Assistant:cached

    ports:
      - "8000:8000"
      - "8080:8080"
      - "8888:8888"
      - "5000:5000"

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    working_dir: /workspaces/AI-buss-Assistant

    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
