version: "3.8"

services:
  ai-business-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        UID: "1000"
        GROUP_GID: "1000"
        UNAME: "builduser"
        UGNAME: "buildgroup"

    container_name: ${CONTAINER_NAME:-ai-business-assistant-dev}
    hostname: ${HOSTNAME:-ai-business-assistant}

    command: sleep infinity

    init: true
    tty: true
    stdin_open: true

    volumes:
      - ..:/home/builduser/APP:cached
      - ${HOME}/.ssh:/home/builduser/.ssh:ro
      - ${HOME}/.gitconfig:/home/builduser/.gitconfig:ro

    ports:
      - "8000:8000"
      - "8080:8080"
      - "8888:8888"
      - "5000:5000"

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"

    user: "1000:1000"
    working_dir: /home/builduser/APP

    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge